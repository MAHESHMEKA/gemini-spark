name: "⚡ Propose a New Task Prompt"
description: "Submit a new ready-to-use task prompt for Gemini Spark"
title: "[Task]: <Task Title>"
labels: ["category: task"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing a new Gemini Spark task prompt! Please fill out the fields below.
  - type: input
    id: task_name
    attributes:
      label: Task Name
      description: What is the concise name for this task?
      placeholder: "e.g., Weekly Calendar & Priority Prep"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Select the primary category for this task.
      options:
        - Email
        - Productivity
        - Career
        - Developer
        - Research
        - Finance
        - Learning
        - Other
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: Purpose & Overview
      description: Explain what this task does, who benefits from it, and what problem it solves.
      placeholder: "This task reviews upcoming calendar events every Sunday evening and..."
    validations:
      required: true
  - type: input
    id: schedule
    attributes:
      label: Recommended Schedule
      description: How often or when should this task run?
      placeholder: "e.g., Daily at 8:00 AM IST / Every Sunday at 6:00 PM"
    validations:
      required: true
  - type: checkboxes
    id: connected_apps
    attributes:
      label: Connected Google Apps
      description: Check all Google Workspace apps required for this task.
      options:
        - label: Gmail
        - label: Google Calendar
        - label: Google Drive / Docs
        - label: Google Keep / Tasks
        - label: None (Independent / Standalone)
  - type: textarea
    id: prompt
    attributes:
      label: Task Prompt Draft
      description: Provide the complete copy-paste-ready prompt.
      placeholder: "Every morning at 8:00 AM, review..."
      render: text
    validations:
      required: true
  - type: textarea
    id: expected_output
    attributes:
      label: Expected Output Sample
      description: Show an example of the output generated by Gemini Spark.
      placeholder: "## Summary\n- Item 1\n- Item 2"
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: validation
    attributes:
      label: Verification & Safety Confirmation
      options:
        - label: I have tested this prompt in Gemini Spark and verified its output.
          required: true
        - label: I have verified that NO personal credentials, API keys, or private emails are included.
          required: true
